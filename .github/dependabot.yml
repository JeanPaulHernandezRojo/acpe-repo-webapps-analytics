# Actualizaciones de dependencias (PRs semanales). Cada PR pasa por pr_checks como cualquier
# otro cambio del portal: tests, build y escaneo de la imagen.
version: 2
updates:
  # Backend y scripts (uv.lock en la raíz del workspace).
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    groups:
      python:
        patterns: ["*"]

  # Frontend (pnpm-lock.yaml).
  - package-ecosystem: npm
    directory: /portal/frontend
    schedule:
      interval: weekly
    groups:
      frontend:
        patterns: ["*"]

  # Imágenes base del Dockerfile (node, python, uv).
  - package-ecosystem: docker
    directory: /portal
    schedule:
      interval: weekly

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
