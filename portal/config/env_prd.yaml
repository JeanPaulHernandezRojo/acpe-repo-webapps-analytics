# Parámetros del ambiente PRD (MVP en un proyecto propio).

ambiente:
  nombre: "prd"
  proyecto: "alejandria-mvp"
  region: "us-east1"

cloud_run:
  servicio: "mvp-prd-run-portal-webapps"
  cuenta_runtime: "mvp-gsa-portal-runtime@alejandria-mvp.iam.gserviceaccount.com"
  min_instances: 0
  max_instances: 1
  cpu: "1"
  memoria: "1Gi"
  concurrencia: 80

imagen:
  repositorio: "us-east1-docker.pkg.dev/alejandria-mvp/mvp-arg-portal"
  nombre: "portal-webapps"

bucket:
  nombre: "alejandria-mvp-webapps"
  prefijo: "prd"

sesion:
  horas: 12

auditoria:
  latido_segundos: 300

catalogo:
  ttl_segundos: 60

limites:
  usuario_por_minuto: 120
  ip_por_minuto: 30
  ip_indice_desde_final: 1
