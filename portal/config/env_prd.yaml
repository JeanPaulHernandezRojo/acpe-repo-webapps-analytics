# Parámetros del ambiente PRD. Los lee el backend (vía APP_ENV=prd) y los workflows de despliegue.

ambiente:
  # Nombre corto del ambiente: se usa en labels, eventos de auditoría y el prefijo del bucket.
  nombre: "prd"
  proyecto: "acpe-prod-uc-ml"
  region: "us-east1"

cloud_run:
  servicio: "us-prod-run-portal-webapps"
  cuenta_runtime: "prod-gsa-portal-runtime@acpe-prod-uc-ml.iam.gserviceaccount.com"
  # Instancias: 1 siempre encendida para responder en menos de 2 s. max = techo de gasto.
  # Editar y redesplegar (con pase a PRD) para cambiarlas.
  min_instances: 1
  max_instances: 1
  cpu: "1"
  memoria: "1Gi"
  # Requests simultáneos que atiende cada instancia.
  concurrencia: 80

imagen:
  # Repositorio de Artifact Registry del ambiente (compartido con los pipelines de ML).
  repositorio: "us-east1-docker.pkg.dev/acpe-prod-uc-ml/us-prod-arg-ml-pipelines"
  nombre: "portal-webapps"

bucket:
  nombre: "us-prod-stg-ml-webapps"
  # Carpeta del ambiente dentro del bucket: <prefijo>/<dominio>/<app>/index.html y <prefijo>/_catalogo/.
  prefijo: "prd"

sesion:
  # Vigencia máxima de la sesión en el servidor. La cookie además se borra al cerrar el navegador.
  horas: 12

auditoria:
  # Cada cuántos segundos el visor envía un "latido" mientras la pestaña está visible.
  latido_segundos: 300

catalogo:
  # Segundos que el backend reutiliza el catálogo leído del bucket antes de volver a leerlo.
  ttl_segundos: 60

limites:
  # Requests por minuto por correo en rutas con sesión (el exceso recibe 429).
  usuario_por_minuto: 120
  # Requests por minuto por IP en rutas públicas (ingreso y configuración).
  ip_por_minuto: 30
  # Posición, contada desde el final, de la IP del cliente en X-Forwarded-For.
  # 1 = último valor (el que agrega la infraestructura de Google). Se verifica en QA.
  ip_indice_desde_final: 1
